# Fase 2 - Feature 1 (consulta publica). Se levanta con:  docker compose up -d --build
# Paso actual: replica + consulta-service. La web se agrega en el siguiente paso.
name: consulta-publica

services:
  # Copia de solo lectura de la base del monolito (el diagrama la llama "Replica").
  # Se crea desde cero con los scripts de db/init, en orden alfabetico: esquema -> usuario base ->
  # datos -> usuario de solo lectura. Los scripts SOLO corren la primera vez (cuando el volumen esta vacio).
  replica:
    image: mysql:8.0
    container_name: consulta-replica
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD - copia .env.example como .env}"
      MYSQL_DATABASE: gestion_agua
    volumes:
      - replica-datos:/var/lib/mysql
      - ./db/init/01-esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      - ./db/init/02-usuario-base.sql:/docker-entrypoint-initdb.d/02-usuario-base.sql:ro
      - ./db/init/03-datos.sql:/docker-entrypoint-initdb.d/03-datos.sql:ro
      - ./db/usuario-solo-lectura.sql:/docker-entrypoint-initdb.d/04-usuario-solo-lectura.sql:ro
    healthcheck:
      # Durante la inicializacion MySQL solo escucha por socket, asi que este ping por TCP
      # solo funciona cuando los scripts ya terminaron: "healthy" significa "listo para usarse".
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    ports:
      # Solo para inspeccionar desde tu PC (127.0.0.1 = nadie mas en la red lo ve).
      # 3308 porque el 3307 lo usa el MySQL del monolito.
      - "127.0.0.1:3308:3306"

  # Microservicio Spring Boot de solo lectura (Feature 1).
  consulta-service:
    build: ./consulta-service
    container_name: consulta-service
    restart: unless-stopped
    depends_on:
      replica:
        condition: service_healthy   # no arranca hasta que la replica este lista
    environment:
      # Dentro de la red de Docker la replica se llama "replica" y escucha en 3306 (no en 3308).
      DB_URL: "jdbc:mysql://replica:3306/gestion_agua?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: consulta_ro          # usuario SOLO LECTURA (db/usuario-solo-lectura.sql)
      DB_PASSWORD: consulta_ro_pass
      # La IP real del visitante llega en X-Forwarded-For desde la web. Es seguro confiar en esa
      # cabecera porque este servicio solo es alcanzable desde la red interna de Docker.
      RATE_LIMIT_TRUST_FORWARDED_FOR: "true"
    healthcheck:
      # Basta con que Tomcat acepte conexiones en 8081 (la imagen trae bash, no curl).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    ports:
      # Solo para probar desde tu PC (8082 para no chocar con el 8081 de IntelliJ).
      # En el despliegue final se quita: solo la web debe poder llamar a este servicio.
      - "127.0.0.1:8082:8081"

volumes:
  replica-datos:
